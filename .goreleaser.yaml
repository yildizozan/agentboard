# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: agentboard

before:
  hooks:
    # The board UI is embedded into the binary, so it must be built first.
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - main: .
    binary: agentboard
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - windows_amd64
      - darwin_amd64
      - darwin_arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs", "^test", "^chore"]
